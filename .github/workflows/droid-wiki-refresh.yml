name: Droid Wiki Refresh

on:
  push:
    branches: [main]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Configure git identity
        run: |
          git config --global user.name "Droid Wiki Bot"
          git config --global user.email "actions@github.com"

      # Model endpoint details live in repository variables (never in the repo):
      #   vars.GROVE_MODEL_ID   e.g. custom:<your-model-id>
      #   vars.GROVE_MODEL      e.g. <your-backend-model-name>
      #   vars.GROVE_BASE_URL   e.g. https://<your-gateway-host>/openai/v1
      - name: Configure Grove model
        run: |
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'JSONEOF'
          {
            "customModels": [
              {
                "id": "${{ vars.GROVE_MODEL_ID }}",
                "index": 0,
                "displayName": "Grove model",
                "provider": "generic-chat-completion-api",
                "baseUrl": "${{ vars.GROVE_BASE_URL }}",
                "model": "${{ vars.GROVE_MODEL }}",
                "apiKey": "${{ secrets.GROVE_API_KEY }}",
                "extraHeaders": {
                  "api-key": "${{ secrets.GROVE_API_KEY }}"
                },
                "maxOutputTokens": 32768,
                "noImageSupport": true
              }
            ]
          }
          JSONEOF

      - name: Generate wiki
        timeout-minutes: 60
        run: >-
          droid exec
          --output-format stream-json
          --skip-permissions-unsafe
          --model "${{ vars.GROVE_MODEL_ID }}"
          --reasoning-effort off
          "/wiki Refresh the existing droid-wiki baseline. Upload to GitHub Wiki only. Skip Factory Cloud upload and video generation."
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
