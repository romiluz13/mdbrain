name: Droid Wiki Refresh

on:
  push:
    branches: [main, factory/fix-wiki-refresh]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Generate wiki
        run: |
          if ! droid exec --output-format json --auto high "/wiki"; then
            echo "::warning title=Wiki refresh skipped::Factory accepted the API key but could not start a Droid execution. Check the Factory account's model access or billing."
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Wiki refresh skipped

          Factory accepted `FACTORY_API_KEY`, but could not start a Droid execution. Check the Factory account's model access or billing.
          EOF
          fi
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
