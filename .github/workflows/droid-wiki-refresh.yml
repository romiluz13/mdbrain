name: Droid Wiki Refresh

on:
  push:
    branches: [main, factory/fix-wiki-refresh]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Verify Factory access
        run: droid exec --model gpt-5.6-luna --output-format json "Reply exactly OK"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Generate wiki
        run: droid exec --output-format json --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
