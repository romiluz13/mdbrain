name: Droid Wiki Refresh

on:
  push:
    branches: [main, factory/use-grove-wiki]

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Configure git identity
        run: |
          git config --global user.name "Droid Wiki Bot"
          git config --global user.email "actions@github.com"

      - name: Configure Grove model
        run: |
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'JSONEOF'
          {
            "customModels": [
              {
                "id": "custom:Grove-GLM-5.2-Fireworks-0",
                "index": 0,
                "displayName": "Grove GLM 5.2 Fireworks",
                "provider": "generic-chat-completion-api",
                "baseUrl": "https://grove-gateway-prod.azure-api.net/grove-foundry-prod/openai/v1",
                "model": "FW-GLM-5.2",
                "apiKey": "${{ secrets.GROVE_API_KEY }}",
                "extraHeaders": {
                  "api-key": "${{ secrets.GROVE_API_KEY }}"
                },
                "maxOutputTokens": 32768,
                "noImageSupport": true
              }
            ]
          }
          JSONEOF

      - name: Verify Grove model
        run: droid exec --output-format stream-json --model "custom:Grove-GLM-5.2-Fireworks-0" --reasoning-effort off "Reply exactly OK"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Generate wiki
        timeout-minutes: 60
        run: droid exec --output-format stream-json --skip-permissions-unsafe --model "custom:Grove-GLM-5.2-Fireworks-0" --reasoning-effort off "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
