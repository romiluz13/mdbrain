name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (monorepo)
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check publishability
        run: bun run check-publishability

      - name: Test
        run: bun run test

  bundle-smoke:
    name: Compose bundle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # mdbrain and memongo are checked out as siblings so that the compose
      # memongo build context (../../memongo relative to docker/) resolves.
      # memongo is checked out at MEMONGO_CONTRACT_SOURCE_REF — the exact
      # commit recorded beside the contract pin in
      # packages/memory-bridge/src/memongo-runtime.ts — so this job
      # validates the bundle against the pinned contract deterministically.
      # Drift on memongo main is the nightly upgrade rail's job to catch
      # (as data, with a pin-bump PR), not this job's.
      - name: Checkout mdbrain
        uses: actions/checkout@v7
        with:
          path: mdbrain

      - name: Resolve pinned Memongo ref
        working-directory: mdbrain
        run: |
          ref=$(sed -n 's/^export const MEMONGO_CONTRACT_SOURCE_REF = "\([^"]*\)".*/\1/p' packages/memory-bridge/src/memongo-runtime.ts)
          if [ -z "$ref" ]; then
            echo "MEMONGO_CONTRACT_SOURCE_REF not found in packages/memory-bridge/src/memongo-runtime.ts"
            exit 1
          fi
          echo "MEMONGO_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout memongo (sibling, pinned)
        uses: actions/checkout@v7
        with:
          repository: romiluz13/Memongo
          ref: ${{ env.MEMONGO_REF }}
          path: memongo

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - name: Install dependencies (for scripts/compose-smoke.ts)
        run: |
          cd mdbrain
          bun install --frozen-lockfile

      # compose-smoke imports @mdbrain/client, whose entry point resolves
      # to the package's built dist/ — build it (and its workspace deps)
      # before running the journey.
      - name: Build client SDK for compose-smoke
        run: |
          cd mdbrain
          bunx turbo run build --filter '@mdbrain/client'

      - name: Build bundle images
        run: |
          cd mdbrain
          docker compose -f docker/compose.full.yml build

      - name: Boot the full stack
        run: |
          cd mdbrain
          docker compose -f docker/compose.full.yml up -d

      - name: Run compose-smoke journey
        env:
          MDBRAIN_API_KEY: dev-mdbrain-key
        run: |
          cd mdbrain
          bun scripts/compose-smoke.ts

      - name: Teardown
        if: always()
        run: |
          cd mdbrain
          docker compose -f docker/compose.full.yml down -v
