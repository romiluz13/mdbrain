# Transactions-only dev fixture: MongoDB 7 single-node replica set, NO
# mongot / Atlas Search. /ready and /v1/wiki/search fail closed by design on
# this stack (the search readiness probe cannot reach mongot) — use
# docker/mongodb/docker-compose.preview.yml (MongoDB + Search) or the
# canonical docker/compose.full.yml for working search. NOT part of the
# canonical quickstart. Run `apps/api` on the host with
# MDBRAIN_WIKI_MONGODB_URI pointing at the replica set; Memongo is a
# separate HTTP dependency configured with MEMONGO_API_URL.
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mdbrain_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate().ok }' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mdbrain_mongo_data: {}
